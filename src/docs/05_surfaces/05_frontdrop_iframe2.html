<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Documentation | Hubble UI</title>
        <meta name="description" content="">
        <script src="{{ASSET_PATH}}dist/js/hubble.lazyload.js"></script>
        <link rel="stylesheet" href="{{ASSET_PATH}}dist/css/lazyload.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{{ASSET_PATH}}dist/css/hubble-icons.css">
        <link rel="stylesheet" href="{{ASSET_PATH}}dist/css/hubble.css">
        <link rel="stylesheet" href="{{ASSET_PATH}}dist/css/docs.css">
    </head>
    <body>
        <div class="flex-row-fluid align-cols-center pole-md">
            <button class="btn js-trigger-fd">Open</button>
        </div>
        
        <script src="{{ASSET_PATH}}dist/js/hubble.bundle.js"></script>
        <script src="{{ASSET_PATH}}dist/js/docs.js"></script>
        <script type="text/javascript">
            const frontdrop = Hubble.Frontdrop(
            {
                keepEdge:        true,
                state:           'collapsed',
                title            : '&nbsp;',
                content          : `<span class="skeleton skeleton-h5" style="width:150px"></span><div class="skeleton skeleton-block skeleton-wave" style="width: 100%; height: auto; aspect-ratio: 16 / 9;"></div>
                        <div class="skeleton-text-block skeleton-lines">
                            <div class="skeleton" style="width: 81%;"></div>
                            <div class="skeleton" style="width: 84%;"></div>
                            <div class="skeleton" style="width: 91%;"></div>
                        </div>`
            });

            document.querySelector('.js-trigger-fd').addEventListener('click', () => frontdrop.open());
        </script>
    </body>
</html>
